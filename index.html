<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curiosidades do Espaço - Modo Espacial</title>
    <style>
        /* Estilos com fundo azul marinho e design moderno */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #0d1b2a; /* Azul Marinho Escuro */
            color: #f0f8ff; /* Texto Claro */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #1b263b; /* Card Azul Marinho Suave */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
            border: 1px solid #415a77;
        }

        h1 {
            color: #e0e1dd;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .contador {
            font-size: 14px;
            color: #a3b18a;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .mensagem {
            font-size: 18px;
            line-height: 1.6;
            margin: 30px 0;
            min-height: 80px; /* Evita que o card mude de tamanho drasticamente */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e1dd;
        }

        /* Container para alinhar os botões */
        .botoes-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 18px;
            font-size: 14px;
            font-weight: bold;
            color: #0d1b2a;
            background-color: #e0e1dd;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #e0e1ddcc;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #415a77;
            color: #1b263b;
            cursor: not-allowed;
            transform: none;
        }

        /* Destaque para o botão de fechar/reiniciar */
        .btn-fechar {
            background-color: #e63946;
            color: white;
        }

        .btn-fechar:hover {
            background-color: #d62828;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Explorando o Universo 🚀</h1>
        <!-- Exibe em qual curiosidade o usuário está -->
        <div class="contador" id="contador">Início</div>
        
        <!-- Área da mensagem -->
        <p class="mensagem" id="texto-mensagem">Clique em "Próxima" para começar a navegar pelas curiosidades do espaço!</p>
        
        <!-- Controles de Navegação -->
        <div class="botoes-container">
            <button id="btn-anterior" disabled>⬅️ Anterior</button>
            <button id="btn-proximo">Próxima ➡️</button>
            <button id="btn-fechar" class="btn-fechar" disabled>Fechar ✖️</button>
        </div>
    </div>

    <script>
        // 1. Lista com as 10 curiosidades espaciais
        const curiosidades = [
            "🌌 Um dia em Vênus é mais longo do que um ano inteiro em Vênus! Ele demora mais para rodar em torno de si mesmo do que para dar uma volta ao redor do Sol.",
            "🪐 Saturno flutuaria na água! Como o planeta é feito majoritariamente de gás, sua densidade é menor que a da água.",
            "👣 As pegadas deixadas pelos astronautas na Lua vão durar milhões de anos, pois lá não há vento ou água para apagá-las.",
            "☀️ O Sol é gigante: caberiam cerca de 1,3 milhão de planetas Terra inteiros dentro dele.",
            "💎 Em Júpiter e Saturno, cientistas acreditam que chovem diamantes devido à alta pressão que esmaga o carbono na atmosfera.",
            "🚀 No espaço profundo reina o silêncio absoluto. Como não há atmosfera (ar) para o som se propagar, nenhuma explosão faz barulho.",
            "🔴 Marte abriga o maior vulcão do Sistema Solar, o Monte Olimpo. Ele é três vezes mais alto do que o Monte Everest.",
            "🌟 Existem mais estrelas no universo observável do que grãos de areia em todas as praias do planeta Terra.",
            "🕰️ Devido à gravidade extrema, o tempo passa mais devagar perto de um Buraco Negro do que aqui na Terra.",
            "🌌 A galáxia de Andrômeda está em rota de colisão com a nossa Via Láctea, mas isso só vai acontecer daqui a cerca de 4 bilhões de anos."
        ];

        // 2. Controle de estado (-1 significa que está na tela inicial de boas-vindas)
        let indiceAtual = -1;

        // 3. Seleção dos elementos HTML
        const textoMensagem = document.getElementById("texto-mensagem");
        const contador = document.getElementById("contador");
        const btnAnterior = document.getElementById("btn-anterior");
        const btnProximo = document.getElementById("btn-proximo");
        const btnFechar = document.getElementById("btn-fechar");

        // 4. Função principal que atualiza a interface
        function atualizarPagina() {
            if (indiceAtual === -1) {
                // Estado Inicial (Antes de começar)
                textoMensagem.textContent = "Clique em \"Próxima\" para começar a navegar pelas curiosidades do espaço!";
                contador.textContent = "Início";
                btnAnterior.disabled = true;
                btnFechar.disabled = true;
                btnProximo.disabled = false;
                btnProximo.textContent = "Começar ➡️";
            } else {
                // Exibindo uma curiosidade ativa
                textoMensagem.textContent = curiosidades[indiceAtual];
                contador.textContent = `Curiosidade ${indiceAtual + 1} de ${curiosidades.length}`;
                
                // Gerencia o botão "Anterior"
                btnAnterior.disabled = (indiceAtual === 0);
                
                // Gerencia o botão "Próximo"
                if (indiceAtual === curiosidades.length - 1) {
                    btnProximo.disabled = true;
                    btnProximo.textContent = "Fim 🌟";
                } else {
                    btnProximo.disabled = false;
                    btnProximo.textContent = "Próxima ➡️";
                }
                
                // Ativa o botão de fechar/voltar ao início
                btnFechar.disabled = false;
            }
        }

        // 5. Funções dos botões
        function avancar() {
            if (indiceAtual < curiosidades.length - 1) {
                indiceAtual++;
                atualizarPagina();
            }
        }

        function voltar() {
            if (indiceAtual > 0) {
                indiceAtual--;
                atualizarPagina();
            }
        }

        function fechar() {
            indiceAtual = -1; // Reseta para a tela inicial
            atualizarPagina();
        }

        // 6. Vinculando as funções aos cliques dos botões
        btnProximo.addEventListener("click", avancar);
        btnAnterior.addEventListener("click", voltar);
        btnFechar.addEventListener("click", fechar);
    </script>

</body>
</html>
